<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/joystick.css">
    <link rel="stylesheet" href="css/switch.css">
    <title>Terreno 3D</title>
</head>
<body>
    <main>
        <div>
            <canvas id="tela"></canvas>

            <!-- Joystick virtual: arraste para girar o terreno (duplo clique = resetar vista) -->
            <div id="directional-pad" class="directional-pad" title="Arraste para girar · duplo clique para resetar">
                <div class="circle">
                    <div class="horizontal-line" data-direction="1"></div>
                    <div class="vertical-line" data-direction="1"></div>
                </div>
            </div>

            <div>
                <label for="zoom">Zoom</label>
                <input type="range" id="zoom" min="1.5" max="3" step="0.5" value="1.5"
                    oninput="valorZoom.textContent = this.value + '×'" />
                <output id="valorZoom">1.5×</output>
            </div>
        </div>
        <div>
            <fieldset>
                <legend>Configurar</legend>

                <div>
                    <label for="algoritmo">Terreno</label>
                    <input type="range" id="algoritmo" min="0" max="7" value="0"
                        oninput="valorAlgoritmo.textContent = Algoritmo.nomes[this.value]" />
                    <output id="valorAlgoritmo">Colinas</output>
                </div>

                <div>
                    <label for="velocidade">Velocidade</label>
                    <input type="range" id="velocidade" min="0" max="1" step="0.01" value="0"
                        oninput="valorVelocidade.textContent = this.value" />
                    <output id="valorVelocidade">0</output>
                </div>

                <div>
                    <label for="amplitude">Amplitude</label>
                    <input type="range" id="amplitude" min="1" max="200" value="1"
                        oninput="valorAmplitude.textContent = this.value" />
                    <output id="valorAmplitude">1</output>
                </div>

                <div>
                    <label for="frequencia">Frequência</label>
                    <input type="range" id="frequencia" min="0.1" max="2" step="0.1" value="0.1"
                        oninput="valorFrequencia.textContent = this.value" />
                    <output id="valorFrequencia">0.1</output>
                </div>

                <div>
                    <label class="switch">
                        Personagem
                        <input type="checkbox" id="personagemAtivo" checked autocomplete="off">
                        <span class="slider"></span>
                    </label>
                </div>

                <div>
                    <label class="switch">
                        Obstáculos
                        <input type="checkbox" id="obstaculosAtivos" checked autocomplete="off">
                        <span class="slider"></span>
                    </label>
                </div>

                <div>
                    <label class="switch">
                        Itens
                        <input type="checkbox" id="itensAtivos" checked autocomplete="off">
                        <span class="slider"></span>
                    </label>
                </div>

                <div>
                    <label class="switch">
                        NPCs
                        <input type="checkbox" id="npcsAtivos" checked autocomplete="off">
                        <span class="slider"></span>
                    </label>
                </div>
            </fieldset>

            <p class="ajuda">
                Setas/WASD andam · clique esquerdo anda até o ponto (segure para seguir o mouse) · Espaço pula · 1-3 escolhem o slot · F ou botão direito ataca/come · E pega · Q solta · R revive
            </p>
        </div>
    </main>

    <script src="terreno/Algoritmo.js"></script>
    <script src="jogo/Obstaculos.js"></script>
    <script src="jogo/Itens.js"></script>
    <script src="jogo/Inventario.js"></script>
    <script src="jogo/Npcs.js"></script>
    <script src="jogo/Hud.js"></script>
    <script src="jogo/Jogo.js"></script>
    <script src="jogo/Personagem.js"></script>
    <script src="terreno/TerrenoIsometrico.js"></script>
    <script src="terreno/GerarTerreno.js"></script>
    <script src="controles/Joystick.js"></script>
    <script src="main.js"></script>
</body>
</html>
